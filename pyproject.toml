[build-system]
requires = [
  "setuptools >=84.0.0", # required for compiler initialization compatibility
]
build-backend = "setuptools.build_meta"

[dependency-groups]
checkers = [ # Keep these in sync with .pre-commit-config.yaml
  "clang-format ==18.1.8",
  "ruff ==0.14.14",
]
type-checkers = [
  "setuptools >=83.0.0", # setuptools/_distutils vendor is py.typed
  "types-setuptools",
  "PyOpenGL",
  "mypy ==2.4.*",
  "pyright ==1.1.414",
]
dev = [
  "pre-commit",
  { include-group = "checkers" },
  { include-group = "type-checkers" },
]
